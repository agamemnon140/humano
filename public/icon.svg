<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icone de home screen: um torso em blocos, nao a figura inteira da app.
       A 60px o corpo completo vira um risco cinzento ilegivel; o que le bem
       nesse tamanho sao poucas formas grandes e as cores dos tres niveis. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1b19"/>
      <stop offset="1" stop-color="#0b0b0a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#fundo)"/>

  <g id="corpo">
    <!-- estrutura -->
    <circle cx="256" cy="104" r="46" fill="#8a847a"/>
    <rect x="230" y="140" width="52" height="48" rx="16" fill="#8a847a"/>
    <rect x="340" y="296" width="56" height="162" rx="28" fill="#736d64"/>
    <rect x="116" y="296" width="56" height="162" rx="28" fill="#736d64"/>

    <!-- secundario: deltoides -->
    <ellipse cx="366" cy="240" rx="50" ry="58" fill="#ef9a4e"/>
    <ellipse cx="146" cy="240" rx="50" ry="58" fill="#ef9a4e"/>

    <!-- primario: peitoral -->
    <path d="M 262 194 C 285 192 300 200 306 216 C 312 240 308 272 296 288 C 285 297 271 298 262 296 Z" fill="#e05252"/>
    <path transform="translate(512,0) scale(-1,1)" d="M 262 194 C 285 192 300 200 306 216 C 312 240 308 272 296 288 C 285 297 271 298 262 296 Z" fill="#e05252"/>

    <!-- postural: obliquos -->
    <rect x="296" y="312" width="28" height="106" rx="14" fill="#9784f5"/>
    <rect x="188" y="312" width="28" height="106" rx="14" fill="#9784f5"/>

    <!-- estabilizador: core -->
    <rect x="260" y="306" width="32" height="130" rx="15" fill="#4a93ea"/>
    <rect x="220" y="306" width="32" height="130" rx="15" fill="#4a93ea"/>
  </g>
</svg>
